# =====================================================================
# rules/menu.yaml  -  webview hijack + menu-gated payload rules
# ---------------------------------------------------------------------
# Every rule here is gated on a feature key from menu/features.json, so the
# toggle in the panel IS the switch for the rule. Nothing below runs until you
# flip it.
#
#   feature: ui.inject_menu        -> Hijack Webview
#   feature: cfg.apply_overrides   -> Config Overrides
#   feature: cfg.mute_notices      -> Mute Notices
#   feature: cfg.force_region      -> Force Region (text field)
# =====================================================================

version: 1

rules:
  # ===================================================================
  # 1. FIND THE WEBVIEW URL
  # Free Fire opens in-game pages (news, events, banners, notices) from URLs
  # it receives over HTTPS. Run this first and look for "urls" in the trace.
  #
  #   python tools\hosts.py                       # which host carries them
  #   Select-String -Path logs\flows.jsonl -Pattern 'urls' | Select -First 20
  #
  # Typical carriers: notice / announcement / activity / event / banner /
  # syndicate / config / home / tab / menu / webview / h5.
  # ===================================================================
  - name: probe-webview-urls
    enabled: true
    action: log
    stage: response
    match:
      host_regex: '(?i)(garena|freefire|ggblue)'
      path_regex: '(?i)(notice|announce|activit|event|banner|syndicate|config|home|tab|menu|webview|h5|popup|ads)'
    comment: URLs found in these bodies are recorded in the trace under "urls"

  # ===================================================================
  # 2. THE HIJACK
  # Rewrites every URL string in matching responses to this panel. The game's
  # own webview then renders OUR page inside Free Fire.
  #
  # `to` must be reachable by the phone. Two working choices:
  #   http://menu.ff/               <- resolved by the proxy itself (no DNS,
  #                                    nothing to install, works even offline)
  #   http://192.168.1.23:8082/     <- tools/menu_server.py on the LAN
  # ===================================================================
  - name: hijack-webview-to-menu
    feature: ui.inject_menu
    action: rewrite_urls
    stage: response
    match:
      host_regex: '(?i)(garena|freefire|ggblue)'
      path_regex: '(?i)(notice|announce|activit|event|banner|syndicate|webview|h5|popup)'
    params:
      url_regex: '(?i)^https?://'
      to: 'http://menu.ff/'
      max: 4
    comment: flip "Hijack Webview" in the panel to arm this

  # Narrower variant - only hijack page-like URLs, leave API/CDN untouched.
  - name: hijack-pages-only
    enabled: false
    feature: ui.inject_menu
    action: rewrite_urls
    stage: response
    match:
      path_regex: '(?i)(notice|announce|activit|event|banner|h5|webview)'
    params:
      url_regex: '(?i)^https?://[^"]*(h5|webview|activity|event|notice|news|page|html)'
      to: 'http://menu.ff/'
      max: 3
    comment: safer alternative to hijack-webview-to-menu

  # ===================================================================
  # 3. CONFIG OVERRIDES
  # Payload rules. These need the real key names, which you get from the trace.
  # The "walk keys" built-in (menu toggle cfg.keep_alive / cfg.mute_notices /
  # cfg.force_region) already handles maintenance + notices + region without
  # knowing the schema, so you only write explicit rules for exotic fields.
  #
  # Steps:
  #   1. run.py --body
  #   2. play a session
  #   3. python tools\pbdecode.py --from-trace logs\flows.jsonl --seq N -o body.bin
  #      (or read the resp_hex straight out of flows.jsonl for JSON endpoints)
  #   4. write the path below
  # ===================================================================

  # EXAMPLE - a JSON config endpoint. Replace the paths with what you find.
  # - name: cfg-override-example
  #   feature: cfg.apply_overrides
  #   action: rewrite_json
  #   stage: response
  #   match:
  #     host_regex: '(?i)freefire'
  #     path_regex: '(?i)/config'
  #   params:
  #     set:
  #       "data.anticheat_enabled": false
  #       "data.telem_enabled": false
  #     delete:
  #       - "data.report_url"
  #     merge:
  #       "data.limits": { "max_players": 52 }

  # EXAMPLE - a protobuf config endpoint, no schema needed.
  # - name: cfg-pb-example
  #   feature: cfg.apply_overrides
  #   action: pb_set
  #   stage: response
  #   match:
  #     host_regex: '(?i)freefire'
  #     path_regex: '(?i)(config|setting)'
  #     method: POST
  #   params:
  #     set:
  #       "3.1": 0
  #     set_bytes:
  #       "4": "str:ok"

  # ===================================================================
  # 4. REGION
  # ===================================================================
  # EXAMPLE - force a region string wherever it appears.
  # - name: force-region-example
  #   feature: cfg.force_region
  #   action: rewrite_json
  #   stage: response
  #   match:
  #     host_regex: '(?i)(garena|freefire)'
  #   params:
  #     set:
  #       "data.region": "sg"

  # ===================================================================
  # 5. MANIFEST / ASSET REDIRECT
  # If the client pulls a hot-update manifest over HTTPS you can serve your own.
  # Find the manifest endpoint first (probe-webview-urls already logs URLs).
  # ===================================================================
  - name: probe-manifest
    enabled: false
    action: log
    stage: response
    match:
      path_regex: '(?i)(manifest|hotupdate|res_version|patch|version)'
    comment: find the manifest, THEN decide whether to mock or redirect it

  # - name: manifest-mirror
  #   enabled: false
  #   action: mock
  #   stage: response
  #   match:
  #     host_regex: '(?i)freefire'
  #     path_regex: '(?i)hotupdate/manifest'
  #   params:
  #     status: 200
  #     content_type: application/json
  #     body_file: rules/mock/manifest.json

  # ===================================================================
  # 6. STUTTER / STALL TEST (proves the panel is wired end to end)
  # ===================================================================
  - name: menu-roundtrip-probe
    enabled: false
    feature: sec.quiet
    action: delay
    stage: request
    match:
      host_regex: '(?i)(garena|freefire)'
      path_regex: '(?i)/'
    params:
      ms: 2500
    comment: 'inverted probe: stalls only while Quiet Mode is ON (so you can see it)'
