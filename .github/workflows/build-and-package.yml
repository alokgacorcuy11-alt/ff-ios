name: build-and-package

# Builds native/FFMenu.dylib on a macOS runner, verifies that it does not
# advertise itself, and - if an IPA is available - packages the final IPA and
# uploads it with a manifest. You never need a Mac, and you never need to run
# the packaging by hand.
#
# To get an IPA out of this:
#   1. Actions -> build-and-package -> Run workflow
#   2. paste the URL of your decrypted IPA into `ipa_url` (optional)
#   3. optional: `bundle_id` to re-target for free-cert sideloading
#
# Or set the repository variable FF_IPA_URL once and every push packages it.

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL of the decrypted IPA (optional - empty builds the dylib only)"
        required: false
        type: string
      bundle_id:
        description: "override CFBundleIdentifier (needed for a free Apple ID)"
        required: false
        type: string
      dry_run:
        description: "package but do not upload the (large) IPA"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - "native/**"
      - "tools/**"
      - "menu/**"
      - "ffproxy/**"
      - ".github/workflows/build-and-package.yml"

env:
  IPA_URL: ${{ inputs.ipa_url || vars.FF_IPA_URL }}
  BUNDLE_ID: ${{ inputs.bundle_id || vars.FF_BUNDLE_ID }}
  # Only needed when ipa_url points at a private release asset.
  IPA_TOKEN: ${{ secrets.FF_IPA_TOKEN }}

jobs:
  # ------------------------------------------------------------------ tests
  offline-tests:
    name: offline tests (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: python -m pip install -q pyyaml mitmproxy dnslib
      - name: every offline suite
        run: |
          set -euo pipefail
          # tee so the log survives as an artefact. A failing run on a public
          # repo cannot be read back through the API without a token, so the
          # reason has to be attached to the run itself.
          python tools/tests/run_all.py 2>&1 | tee tests.log

      - name: upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-log
          path: |
            tests.log
            tools/tests/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: shell tooling (bash, no network)
        if: always()
        run: |
          set -euo pipefail
          bash -n tools/fetch_ipa.sh
          bash -n tools/build_ipa.sh
          bash tools/tests/test_fetch_ipa.sh

  # ------------------------------------------------------------------ preflight
  # Everything about the IPA that can be checked before a single line is built.
  preflight:
    name: IPA preflight
    needs: offline-tests
    if: ${{ inputs.ipa_url != '' || vars.FF_IPA_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch the decrypted IPA
        run: |
          set -euo pipefail
          bash tools/fetch_ipa.sh "$IPA_URL" in.ipa
          ls -la in.ipa

      - name: identify it, and refuse if it is not Free Fire
        run: |
          set -euo pipefail
          python tools/ipa_probe.py in.ipa | tee preflight.txt

      - name: the runtime the dylib needs must be exported
        run: |
          set -euo pipefail
          python tools/il2cpp_symbols.py in.ipa --require --out out/il2cpp_symbols.json \
            | tee -a preflight.txt

      - name: locate the dyld slots tier 2 rewrites
        run: |
          set -euo pipefail
          python tools/got_scan.py in.ipa | tee -a preflight.txt

      - uses: actions/upload-artifact@v4
        with:
          name: preflight-report
          path: preflight.txt
          retention-days: 30

  # ------------------------------------------------------------------ dylib
  build-dylib:
    name: build FFMenu.dylib
    # Deliberately NOT gated on offline-tests. A lint failure in the Python
    # tooling must never hide the compiler output - the two answer different
    # questions, and the compiler answer is the one that takes a macOS runner to
    # get. Gating it here meant a single test failure skipped the build and left
    # nothing to read.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: |
          brew install ldid xz make
          echo "SANDBOX=1" >> "$GITHUB_ENV"

      - name: install theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: verify toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: build - release, so no log strings reach the binary
        working-directory: native
        run: |
          set -euo pipefail
          make clean || true
          # Full log to a file: `make | tail -80` loses the FIRST errors, and the
          # first errors are the ones worth reading. Iterating on this workflow
          # means reading compiler output, so keep all of it.
          if ! make RELEASE=1 -j"$(sysctl -n hw.ncpu)" > build.log 2>&1; then
            echo "::error title=build::make failed - full log is attached as build-log"
            tail -150 build.log
            # With -j the output interleaves, so the error is not necessarily in
            # the tail. Publish every line that looks like a failure, ordered,
            # plus the tail - and publish the LINE COUNT first so it is obvious
            # if this filter matched nothing at all.
            esc() { printf '%s' "$1" | sed 's/%/%25/g; s/\r//g'; }
            n=$(wc -l < build.log | tr -d ' ')
            hits=$(grep -icE 'error|\*\*\*|no such|not found|undefined symbol|cannot|fatal' build.log || true)
            printf '::error title=build-summary::%s lines total, %s look like failures\n' \
                   "$n" "$hits"
            grep -inE 'error|\*\*\*|no such|not found|undefined symbol|cannot|fatal' build.log \
              | head -60 | while IFS= read -r l; do
                printf '::error title=build-hit::%s\n' "$(esc "$l")"
              done
            tail -12 build.log | while IFS= read -r l; do
              [ -n "$l" ] && printf '::error title=build-tail::%s\n' "$(esc "$l")"
            done
            exit 1
          fi
          tail -25 build.log

      - name: upload the compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            native/build.log
            native/.theos/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: locate the dylib
        id: find
        run: |
          set -euo pipefail
          D=$(find native/.theos -name 'FFMenu.dylib' | head -1)
          if [ -z "$D" ]; then
            echo "::error::no dylib produced"
            find native/.theos -name '*.log' -exec cat {} \; 2>/dev/null | tail -150 || true
            exit 1
          fi
          echo "dylib=$D" >> "$GITHUB_OUTPUT"
          ls -la "$D"

      - name: platform check
        run: |
          set -euo pipefail
          D="${{ steps.find.outputs.dylib }}"
          xcrun vtool -show-build "$D"
          lipo -info "$D"
          # iOS 12.0 floor, arm64 only: Free Fire 1.132.1 ships no arm64e slice,
          # so an arm64e build is pure risk with zero product value.
          case "$(lipo -archs "$D")" in
            *arm64e*)
              echo "::error::arm64e slice built - ARCHS in the Makefile must stay 'arm64'"
              exit 1 ;;
          esac
          xcrun vtool -show-build "$D" | grep -q "minos 12" \
            || echo "::warning::minimum OS is not 12.0 - check TARGET in the Makefile"

      - name: does it advertise itself?
        run: |
          set -euo pipefail
          D="${{ steps.find.outputs.dylib }}"

          echo "--- undefined symbols (should be system only) ---"
          nm -u "$D" | head -40 || true

          echo
          echo "--- plaintext feature keys (must be none) ---"
          if strings -a "$D" | grep -nE '(^|[^a-z])(aim|esp|debug|ui)\.(enabled|box|hp|fov|smooth|max_dist|verbose|hide_from_capture)'; then
            echo "::error::a feature key is still plaintext - the XOR blob is not being used"
            exit 1
          fi
          echo "none"

          echo
          echo "--- product-name tokens (must be none) ---"
          if strings -a "$D" | grep -niE 'ffmenu|cheat|aimbot|bypass|ffproxy'; then
            echo "::error::the dylib names itself"
            exit 1
          fi
          echo "none"

          echo
          echo "--- softer tokens (informational) ---"
          strings -a "$D" | grep -niE '(^|[^a-z])(esp|aim)([^a-z]|$)' | head -20 || echo "none"

          echo
          echo "--- the identifying strings we replaced ---"
          for s in us.core runtime ff_native; do
            if strings -a "$D" | grep -q "$s"; then
              echo "::warning::found '$s' in the binary"
            fi
          done
          echo "checked"

      - uses: actions/upload-artifact@v4
        with:
          name: FFMenu-dylib
          path: native/.theos/obj/**/*.dylib
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------ package
  package:
    name: package IPA
    needs: [build-dylib, preflight]
    if: ${{ inputs.ipa_url != '' || vars.FF_IPA_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: FFMenu-dylib
          path: dylib

      - name: fetch the decrypted IPA
        run: |
          set -euo pipefail
          bash tools/fetch_ipa.sh "$IPA_URL" in.ipa

      - name: package
        id: pack
        run: |
          set -euo pipefail
          D=$(find dylib -name '*.dylib' | head -1)
          echo "dylib: $D"
          if [ -n "$BUNDLE_ID" ]; then
            python tools/package_ipa.py in.ipa "$D" --bundle-id "$BUNDLE_ID"
          else
            python tools/package_ipa.py in.ipa "$D"
          fi
          OUT=$(find out -name '*.ipa' -newer in.ipa | head -1)
          [ -n "$OUT" ] || OUT=$(ls -t out/*.ipa | head -1)
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - name: verify the output, and prove the camouflage landed
        run: |
          set -euo pipefail
          OUT="${{ steps.pack.outputs.out }}"
          python tools/ipa_probe.py "$OUT" | tee verify.txt

          if grep -qiE "still App Store encrypted" verify.txt; then
            echo "::error::the payload is encrypted - the input IPA was not decrypted"
            exit 1
          fi

          echo
          echo "--- camouflage: a vendor framework, not a loose dylib ---"
          # The probe calls a load command "injected" only when it resolves to a
          # loose .dylib inside the bundle. A camouflaged build is deliberately
          # NOT that shape - the framework reads as a vendor library, which is
          # the whole point - so the old check (`INJECTED LOAD COMMANDS` must
          # exist) failed every correct build and passed only a broken one.
          if grep -qiE "INJECTED LOAD COMMANDS" verify.txt; then
            echo "::error::the output carries a loose injected dylib - camouflage did not apply"
            exit 1
          fi
          grep -q "UnityServices.framework/UnityServices" verify.txt \
            || { echo "::error::no LC_LOAD_DYLIB entry for UnityServices.framework"; exit 1; }
          echo "load command present"

          echo
          echo "--- and the framework really is inside the payload ---"
          rm -rf verify-unzip && mkdir verify-unzip
          unzip -q "$OUT" -d verify-unzip
          F=$(find verify-unzip/Payload -path '*Frameworks/UnityServices.framework/UnityServices' | head -1)
          [ -n "$F" ] || { echo "::error::UnityServices framework binary is missing from the payload"; exit 1; }
          [ -s "$F" ] || { echo "::error::UnityServices framework binary is empty"; exit 1; }
          ls -la "$F"
          file "$F"

          echo
          echo "--- the shipped image must not name itself ---"
          if strings -a "$F" | grep -niE 'ffmenu|cheat|aimbot|bypass|ffproxy'; then
            echo "::error::the injected image names itself"
            exit 1
          fi
          echo "clean"
          rm -rf verify-unzip

      - name: manifest
        run: |
          set -euo pipefail
          OUT="${{ steps.pack.outputs.out }}"
          D=$(find dylib -name '*.dylib' | head -1)
          {
            echo "built      : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit     : $GITHUB_SHA"
            echo "dylib      : $D"
            echo "dylib sha  : $(sha256sum "$D" | cut -d' ' -f1)"
            echo "ipa        : $OUT"
            echo "ipa sha    : $(sha256sum "$OUT" | cut -d' ' -f1)"
            echo "ipa size   : $(stat -c%s "$OUT") bytes"
            echo "bundle_id  : ${BUNDLE_ID:-unchanged}"
            echo
            echo "--- probe ---"
            cat verify.txt
          } > manifest.txt
          cat manifest.txt

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.dry_run }}
        with:
          name: ff-ipa
          path: |
            out/*.ipa
            manifest.txt
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: ff-manifest
          path: manifest.txt
          retention-days: 30
