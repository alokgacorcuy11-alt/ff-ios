name: cheat

# Builds the injected side and the two tests around it, and publishes the result
# whether or not it worked.
#
# One job, not two. It was two - a host job for the desktop test and a second for
# the Android build - with the second depending on the first. When the host test
# failed, the Android job was skipped, its publish step never ran, and the
# branch kept the previous run's binary and log. Two runs were spent chasing a
# crash that had already been fixed, on a binary that had already been replaced,
# with an error nobody could read.
#
# So: one job, every step appends to build.log, and the publish step runs even
# when the build did not. A failing build must leave behind the reason it failed,
# otherwise the next person re-runs it and learns nothing.

on:
  push:
    paths:
      - "android/cheat/**"
      - ".github/workflows/cheat.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build, test, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: host test
        shell: bash
        run: |
          set -uo pipefail
          : > build.log
          echo "=== host configure" >> build.log
          cmake -S android/cheat -B build-host -DFFCHEAT_HOST_TEST=ON \
            -DCMAKE_BUILD_TYPE=Release >> build.log 2>&1 || echo "CONFIGURE FAILED" >> build.log
          echo "=== host build" >> build.log
          cmake --build build-host -j >> build.log 2>&1 || echo "HOST BUILD FAILED" >> build.log
          echo "=== host run" >> build.log
          if [ -x ./build-host/test_core ]; then
            ./build-host/test_core 2>&1 | tee -a build.log host-test.log || echo "HOST TESTS FAILED" >> build.log
          else
            echo "no test_core binary was produced" >> build.log
          fi
          tail -n 40 build.log

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: android sdk and ndk
        run: |
          set -uo pipefail
          SM="$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "=== sdkmanager: $SM" >> build.log
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "ndk;29.0.13846066" >> build.log 2>&1 || echo "NDK INSTALL FAILED" >> build.log
          ls "$ANDROID_SDK_ROOT/ndk" || true

      - name: native builds
        shell: bash
        run: |
          set -uo pipefail
          TC="$ANDROID_SDK_ROOT/ndk/29.0.13846066/build/cmake/android.toolchain.cmake"
          echo "=== toolchain: $TC" >> build.log
          for ABI in arm64-v8a armeabi-v7a; do
            echo "=== library $ABI" >> build.log
            cmake -S android/cheat -B "build-$ABI" -DCMAKE_TOOLCHAIN_FILE="$TC" \
              -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release >> build.log 2>&1 \
              || echo "CONFIGURE FAILED $ABI" >> build.log
            cmake --build "build-$ABI" -j >> build.log 2>&1 \
              || echo "BUILD FAILED $ABI" >> build.log
          done
          echo "=== real-data test x86_64" >> build.log
          cmake -S android/cheat -B build-real -DFFCHEAT_REAL_TEST=ON \
            -DCMAKE_TOOLCHAIN_FILE="$TC" -DANDROID_ABI=x86_64 \
            -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release >> build.log 2>&1 \
            || echo "CONFIGURE FAILED real" >> build.log
          cmake --build build-real -j >> build.log 2>&1 \
            || echo "BUILD FAILED real" >> build.log
          tail -n 40 build.log

      - name: verify the abi of what came out
        shell: bash
        run: |
          set -uo pipefail
          echo "=== abi check" >> build.log
          for spec in "build-arm64-v8a:183" "build-armeabi-v7a:40"; do
            DIR="${spec%%:*}"; WANT="${spec##*:}"
            SO=$(find "$DIR" -name libffcheat.so 2>/dev/null | head -1 || true)
            if [ -z "$SO" ]; then
              echo "  $DIR: no libffcheat.so" >> build.log
              continue
            fi
            GOT=$(python3 -c "import struct,sys;print(struct.unpack_from('<H',open(sys.argv[1],'rb').read(20),18)[0])" "$SO")
            echo "  $SO: e_machine=$GOT want=$WANT" >> build.log
            [ "$GOT" = "$WANT" ] || echo "  WRONG ARCHITECTURE" >> build.log
          done
          grep -E "e_machine|WRONG|no libffcheat" build.log || true

      - name: publish
        if: always()
        run: |
          set -uo pipefail
          mkdir -p dist
          for ABI in arm64-v8a armeabi-v7a; do
            SO=$(find "build-$ABI" -name libffcheat.so 2>/dev/null | head -1 || true)
            [ -n "$SO" ] && cp "$SO" "dist/libffcheat-$ABI.so" || true
          done
          T=$(find build-real -name test_real 2>/dev/null | head -1 || true)
          [ -n "$T" ] && cp "$T" dist/test_real-x86_64 || true
          cp build.log dist/cheat-build.log
          if [ -f host-test.log ]; then cp host-test.log dist/host-test.log; fi
          { echo "sha ${GITHUB_SHA}"; echo "run ${GITHUB_RUN_NUMBER}"; } > dist/BUILD.txt
          ls -l dist
          cd dist
          git init -q
          git config user.name "ci"
          git config user.email "ci@local"
          git add -A
          git commit -q -m "cheat: $(date -u +%Y%m%d-%H%M%S) ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:cheat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}