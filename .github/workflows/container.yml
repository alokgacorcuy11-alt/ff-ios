name: container

# Builds the base for the no-root container product and publishes what came out.
#
# Why a separate workflow: the container is a foreign codebase (Apache-2.0,
# BlackBox lineage) with its own Gradle setup. Keeping it out of the product's
# workflow means a broken container build cannot block a product release, and
# the pinned commit is recorded so a rebuild compiles the same source.
#
# Why it publishes build.log even when the build fails: the Actions log for a
# job is only readable by a repository admin, and guessing at a foreign
# project's build error is how a day disappears. The log goes out with the
# artefact, so a failure is a file to read rather than a wall to stare at.
#
# Output: the `container` branch, force-pushed, with the debug APK (when the
# build gets that far), build.log, and the commit it came from.

on:
  push:
    paths:
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21, not 17: the base's gallery stub sets source/target 21, and javac
          # says "invalid source release: 21" rather than degrading.
          java-version: "21"

      - name: get the base
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Black00Z/Blacks-BlackBox.git base
          git -C base rev-parse HEAD | tee BASE_COMMIT.txt
          # the two numbers that decide what this thing can do at all
          grep -E "targetSdkVersion|minSdk" base/build.gradle | tee BASE_SDK.txt
          echo "sdk.dir=$ANDROID_SDK_ROOT" > base/local.properties || true
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: android sdk and ndk
        run: |
          set -euo pipefail
          SM="$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "sdkmanager: $SM"
          echo "sdk root:   $ANDROID_SDK_ROOT"
          # The base pins ndkVersion 29.0.13846066 and builds its native hook
          # layer with ndk-build (Android.mk, no CMake). Without the exact NDK
          # the configuration fails before a single class is compiled.
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "ndk;29.0.13846066" > /dev/null 2>&1 || true
          ls "$ANDROID_SDK_ROOT/ndk" || true

      - name: patch the base
        run: |
          set -euo pipefail
          python3 container/patch_split_selection.py base
          # The launcher's loading dialog is a trap when the launch call never
          # returns: it hides the UI, refuses BACK, and the only way out is the
          # Home button. This makes it cancellable, adds a 25 s timeout that says
          # so, and logs both sides of the launch call so "returned false" can be
          # told apart from "never returned".
          python3 container/patch_launcher.py base
          # BPackage.SigningDetails read pastSigningCertificates as a field. That
          # field is absent on some Android versions, and the NoSuchFieldError is
          # thrown from a constructor on the install path - so the install reports
          # success, writes no package record, and the app never appears.
          python3 container/patch_package_signing.py base
          # The base lists five Aliyun mirrors before google(). Gradle asks them
          # in order, so a 502 from one of them fails the whole build even though
          # the artifact is sitting in Google's repository. Google and Maven
          # Central first, mirrors kept below as fallbacks.
          python3 container/patch_repositories.py base
          # Android 9 refuses access to hidden platform APIs. This container
          # reaches into framework internals by design, so every reach is denied
          # and an install reports success having written nothing. One exemption
          # call in every process fixes all of them, including the ones not yet
          # found.
          python3 container/patch_hidden_api.py base
          # The guest died every three seconds with nothing logged, because the
          # crash handler logged after a call that can throw. The stack trace is
          # now written first.
          python3 container/patch_crash_visibility.py base
          # Instrumentation, not a fix: every step of launchApk logs, so a hang
          # names itself instead of being guessed at.
          python3 container/patch_launch_trace.py base
          # The measurement the whole no-root approach rests on: can the
          # container read the memory of the guest it spawned, same uid?
          python3 container/patch_memory_probe.py base

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.13"

      - name: build debug apk
        run: |
          cd base
          # No `set -e`: the whole point is to capture the failure and publish it.
          gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all \
            > ../build.log 2>&1 || echo "BUILD FAILED (exit $?)" | tee -a ../build.log
          tail -n 40 ../build.log || true

      - name: publish
        run: |
          set -euo pipefail
          mkdir -p dist
          find base -path '*outputs/apk/debug/*.apk' -exec cp {} dist/ \; 2>/dev/null || true
          cp build.log dist/ 2>/dev/null || echo "no log" > dist/build.log
          cp BASE_COMMIT.txt BASE_SDK.txt dist/
          ls -l dist
          cd dist
          git init -q
          git config user.name "ci"
          git config user.email "ci@local"
          git add -A
          git commit -q -m "container: $(date -u +%Y%m%d-%H%M%S) ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:container
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}