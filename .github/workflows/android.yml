name: android

# Builds the artefact and publishes it to the `build` branch:
#   dist/ffmenu.apk   - the app, signed with the repository's own key so an
#                       update installs over the previous one instead of
#                       demanding an uninstall
#
# No local Android SDK is needed: download from the build branch.

on:
  push:
    branches: [main]
    paths:
      # The APK does not depend on the storefront, so a change to the page
      # alone must not rebuild it: every rebuild produces a different sha256
      # (zip timestamps), and the page prints the hash of the file it serves.
      - "android/**"
      - "tools/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: tests
        run: |
          # the site's QR encoder is checked bit-for-bit against this one, and
          # it is pure python with no build step
          python3 -m pip install --quiet qrcode
          # runs the daemon for real: abstract socket, /proc, pread/pwrite
          python3 tools/tests/run_all.py

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: forge payload
        run: |
          set -euo pipefail
          # The patch the module loader reads, sealed into a container whose
          # key, name and padding are fresh for this build. The app appends its
          # own random tail on install, so two phones never carry the same file
          # hash inside the game's directory.
          test -f android/payload/Assembly-CSharp-patch.bytes
          python3 tools/payload_forge.py \
            --module android/payload/Assembly-CSharp-patch.bytes \
            --out android/app/feed
          python3 tools/payload_forge.py --open android/app/feed
          ls -l android/app/feed

      - name: build apk
        run: |
          set -euo pipefail
          # One identity, kept in the repository.
          #
          # Earlier builds generated a fresh package id, label and signing key
          # on every run, on the theory that a blacklisted name dies with the
          # build. The bill landed on the buyer: Android refuses an update
          # signed by a different key, so every release was uninstall ->
          # reinstall -> re-paste the key, and a never-seen certificate on a
          # random package id is exactly what an installer's scanner is trained
          # to distrust. That is why Play Protect started refusing the APK.
          #
          # To retire this identity (a package name does end up on a list
          # eventually), change ID and LABEL here and generate a new keystore:
          #   keytool -genkeypair -keystore android/signing/release.jks ...
          # That is a one-commit operation, and it is the only one.
          ID="com.alokg.toolbox"
          LABEL="Toolbox"
          echo "$ID" | grep -Eq '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$' || {
            echo "::error::invalid package id: $ID"; exit 1; }
          gradle -p android/app assembleDebug --no-daemon --stacktrace \
            -PappId="$ID" -PappLabel="$LABEL" \
            -PksFile="$PWD/android/signing/release.jks" \
            -PksPass="demios-toolbox-2026" -PksAlias="toolbox" \
            -PksKeyPass="demios-toolbox-2026" \
            -ProotAppId="com.alokg.roottools" -ProotAppLabel="Root Tools"
          echo "$ID" > .appid
          echo "$LABEL" > .applabel

      - name: verify apk
        run: |
          set -euo pipefail
          APK=$(find android/app/app/build/outputs/apk -name '*.apk' | head -1)
          echo "apk: $APK"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/ffmenu.apk
          # The artefact has to carry the identity the build asked for. This
          # reads the APK back - binary manifest, resources.arsc, signing
          # certificate - so a build that quietly kept the old package id
          # fails here instead of being published with a lie in IDENTITY.txt.
          python3 tools/verify_build.py \
            --apk dist/ffmenu.apk \
            --package "$(cat .appid)" \
            --label "$(cat .applabel)" \
            --identity dist/IDENTITY.txt
          # The site mints keys with LICENSE_SECRET; the phone verifies with the
          # compiled-in License.SECRET. If they differ, every key sold is dead on
          # arrival and nothing else in this pipeline notices - both sides are
          # internally consistent. This reads the secret out of License.java and
          # looks for it in the APK's dex.
          python3 tools/check_apk_secret.py --apk dist/ffmenu.apk
          cat dist/IDENTITY.txt

          # The root tier, built from the same source tree in the same run. It
          # is verified the same way: the package it claims to be, the label in
          # the table, and no native binaries.
          ROOTAPK=$(find android/app/rootapp/build/outputs/apk -name '*.apk' | head -1)
          test -n "$ROOTAPK"
          cp "$ROOTAPK" dist/ffroot.apk
          python3 tools/verify_build.py \
            --apk dist/ffroot.apk \
            --package "com.alokg.roottools" \
            --label "Root Tools" \
            --identity dist/ROOT-IDENTITY.txt
          cat dist/ROOT-IDENTITY.txt

          sha256sum dist/* | tee dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: ffmenu-android
          path: dist/*

      # actions/upload-artifact needs a login to download from a public repo;
      # a branch file does not. Same reason as the iOS build.
      - name: publish to build branch
        run: |
          cd dist
          git init -q
          git config user.name "ci"
          git config user.email "ci@local"
          git add -A
          git commit -q -m "android: $(date -u +%Y%m%d-%H%M%S) ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
