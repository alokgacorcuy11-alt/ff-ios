# ===== site/wrangler.toml - the whole site =====
#
# This directory is the Pages project now: public/ is the site, functions/ is its
# API. It used to be an overlay that had to be merged into another project, which
# is why this file used to say "fragment". It does not any more.
#
#   cd site
#   npx wrangler pages deploy public --project-name demios --branch main
#
# Both `wrangler` and the dashboard work; neither needs the other.

name = "demios"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"

# ---- order storage --------------------------------------------------------
# A namespace of its own, not the one the iOS build used (KEYS). That binding is
# still on the project and now unused; it is left alone rather than deleted,
# because the keys it holds cannot be recovered once it is gone.
[[kv_namespaces]]
binding = "DEMIOS_KV"
id = "d6ff8b28077b43caad79594c87c7b407"

# ---- plain configuration ---------------------------------------------------
[vars]
PAY_MODE = "manual"          # manual | klikqris
ORDER_RATE_PER_HOUR = "30"   # per IP; 0 disables the cap

# ---- secrets (set with wrangler, never stored here) -----------------------
#   wrangler pages secret put LICENSE_SECRET --project-name demios
#   wrangler pages secret put ADMIN_SECRET   --project-name demios
#   wrangler pages secret put QRIS_STATIC    --project-name demios
#   wrangler pages secret put WEBHOOK_SECRET --project-name demios   (optional)
#   wrangler pages secret put KLIKQRIS_KEY   --project-name demios   (PAY_MODE=klikqris)
#
# LICENSE_SECRET must equal License.SECRET in
# android/app/app/src/main/java/com/alokg/ffmenu/License.java.
# site/tools/deploy.py prints it from that file, so it cannot be mistyped.
#
# KLIKQRIS_KEY falls back to KLIKQRIS_API_KEY, which the project already has.
#
# Preview deployments do NOT inherit production secrets. Setting one here does
# not put it in the preview environment and the other way round.
